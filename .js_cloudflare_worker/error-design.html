<!doctype html>
<html lang="en">
<head>
  <title>the server for ${siteName} is down.</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <link rel="icon" type="image/x-icon" href="https://github.com/fonseware/.github/blob/main/fw_favicon.png?raw=true" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', 'system-ui', 'sans-serif'],
          },
          colors: {
            primary: {
              400: '#e6b3e6',
              500: '#cc99cc',
              600: '#b380b3',
              800: '#990099',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #050505;
      background-image: radial-gradient(circle at 50% 0%, #1a0f1a 0%, #050505 70%);
      color: #e2e8f0;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 2rem 0;
      box-sizing: border-box;
    }

    /* SLIDING SKELETON LOADING STYLES */
    .skeleton {
      color: transparent !important;
      border-color: transparent !important;
      text-decoration-color: transparent !important;
      background: linear-gradient(90deg, #1e1e24 25%, #2a2a35 50%, #1e1e24 75%);
      background-size: 200% 100%;
      animation: skeleton-slide 1.5s infinite linear;
      user-select: none;
      pointer-events: none;
      border-radius: 0.375rem;
    }

    img.skeleton {
      content: url('data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7');
    }

    @keyframes skeleton-slide {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="antialiased text-sm sm:text-base selection:bg-primary-800 selection:text-white">

  <!-- Main Card Container -->
  <main class="w-full max-w-md mx-4 p-8 sm:p-10 bg-[#0a0a0a] border border-gray-800 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] flex flex-col items-center text-center relative overflow-hidden">
    
    <!-- Top glowing accent -->
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary-800 to-transparent opacity-70"></div>

    <a href="https://fnswe.me" class="block mb-8 transition-transform hover:scale-105 active:scale-95" aria-label="Go to domain">
      <img
        src="https://github.com/fonseware/.github/blob/main/fw_logo.png?raw=true"
        alt="logo"
        class="h-8 object-contain skeleton"
      />
    </a>

    <h2 class="text-xl sm:text-2xl font-bold text-gray-100 mb-3 skeleton tracking-tight">the server for ${siteName} is down.</h2>
    
    <p class="text-gray-400 mb-6 leading-relaxed skeleton max-w-[280px]">
      ${bodyText}
    </p>

    <div class="w-full flex flex-col sm:flex-row gap-3 mt-4 mb-2">
        <button onclick="window.location.href='${primaryBtnLink}'" class="skeleton flex-1 px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 transition-colors font-medium text-sm border border-gray-700">
            ${primaryBtnText}
        </button>
        <button onclick="window.location.href='https://en.wikipedia.org/wiki/Grass'" class="skeleton flex-1 px-4 py-2 rounded-lg bg-primary-800/20 hover:bg-primary-800/40 text-primary-400 transition-colors font-medium text-sm border border-primary-800/30">
            touch grass
        </button>
    </div>

  </main>

  <script>
    window.addEventListener("load", () => {
      document.fonts.ready.then(() => {
        setTimeout(() => {
          document.querySelectorAll('.skeleton').forEach(el => {
            el.classList.remove('skeleton');
          });
        }, 300);
      });
    });
  </script>
</body>
</html>
