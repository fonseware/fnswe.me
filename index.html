<!doctype html>
<html lang="en">
<head>
  <title>redirecting...</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <link id="dynamic-favicon" rel="icon" type="image/x-icon" href="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', 'system-ui', 'sans-serif'],
          },
          colors: {
            primary: {
              400: 'var(--color-primary-400)',
              500: 'var(--color-primary-500)',
              600: 'var(--color-primary-600)',
              800: 'var(--color-primary-800)',
            }
          }
        }
      }
    }
  </script>

  <style>
    :root {
      /* ==========================================
         STYLE CONFIGURATION (Edit these colors)
         ========================================== */
      --color-primary-400: #e6b3e6;
      --color-primary-500: #cc99cc;
      --color-primary-600: #b380b3;
      --color-primary-800: #990099;
      
      scrollbar-width: thin;
      scrollbar-color: #333333 #050505;
    }

    body {
      background-color: #050505;
      background-image: radial-gradient(circle at 50% 0%, #1a0f1a 0%, #050505 70%);
      color: #e2e8f0;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 2rem 0;
      box-sizing: border-box;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #050505; }
    ::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555555; }

    /* SLIDING SKELETON LOADING STYLES */
    .skeleton {
      color: transparent !important;
      border-color: transparent !important;
      text-decoration-color: transparent !important;
      background: linear-gradient(90deg, #1e1e24 25%, #2a2a35 50%, #1e1e24 75%);
      background-size: 200% 100%;
      animation: skeleton-slide 1.5s infinite linear;
      user-select: none;
      pointer-events: none;
      border-radius: 0.375rem;
    }

    img.skeleton {
      content: url('data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7');
    }

    @keyframes skeleton-slide {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Circular Countdown Animation */
    .countdown-circle {
      transition: stroke-dashoffset 1s linear;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    
    .link-hover { transition: all 0.2s ease-in-out; }
    .link-hover:hover {
      color: var(--color-primary-400);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* Specific scrollbar for the links list */
    .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #333 #111;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #111; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body class="antialiased text-sm sm:text-base selection:bg-primary-800 selection:text-white">

  <!-- Main Card Container -->
  <main class="w-full max-w-md mx-4 p-8 sm:p-10 bg-[#0a0a0a] border border-gray-800 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] flex flex-col items-center text-center relative overflow-hidden">
    
    <!-- Top glowing accent -->
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary-800 to-transparent opacity-70"></div>

    <a id="logo-link" href="#" class="block mb-8 transition-transform hover:scale-105 active:scale-95" aria-label="Go to domain">
      <img
        id="logo-img"
        src=""
        alt="logo"
        class="h-8 object-contain skeleton"
      />
    </a>

    <h2 id="redirect-title" class="text-xl sm:text-2xl font-bold text-gray-100 mb-3 skeleton tracking-tight">redirecting...</h2>
    
    <p id="redirect-desc" class="text-gray-400 mb-6 leading-relaxed skeleton max-w-[280px]">
      <!-- Populated via JS Config -->
    </p>

    <div id="countdown-container" class="hidden flex-col items-center mb-6">
      <div class="relative w-16 h-16 flex items-center justify-center mb-2">
        <svg class="absolute w-full h-full" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" fill="none" stroke="#1f2937" stroke-width="6" />
          <circle id="countdown-progress" class="countdown-circle text-primary-800" cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="6" stroke-dasharray="283" stroke-dashoffset="0" />
        </svg>
        <span id="countdown-text" class="text-xl font-bold text-gray-100"></span>
      </div>
      <span id="seconds-label" class="text-xs text-gray-500 uppercase tracking-widest font-semibold"></span>
    </div>

    <div id="action-buttons" class="hidden w-full flex-col sm:flex-row gap-3 mt-4 mb-2">
        <button id="cancel-btn" onclick="cancelRedirect()" class="flex-1 px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 transition-colors font-medium text-sm border border-gray-700">
            <div class="flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                <span id="cancel-btn-text"></span>
            </div>
        </button>
        <button id="list-btn" onclick="goToRedirects()" class="hidden flex-1 px-4 py-2 rounded-lg bg-primary-800/20 hover:bg-primary-800/40 text-primary-400 transition-colors font-medium text-sm border border-primary-800/30">
            <div class="flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                <span id="list-btn-text"></span>
            </div>
        </button>
    </div>

    <div id="links-container" class="hidden w-full mt-4 flex-col text-left">
        <div class="flex items-center justify-between border-b border-gray-800 pb-2 mb-3">
            <h3 id="routes-title" class="text-gray-300 font-semibold"></h3>
            <span id="total-links" class="text-xs text-gray-500 bg-gray-800 px-2 py-1 rounded-full"></span>
        </div>
        
        <ul id="links-list" class="space-y-2 mb-4 max-h-[300px] overflow-y-auto pr-2 custom-scrollbar">
            <!-- List items injected via JS -->
        </ul>

        <div class="flex items-center justify-between pt-3 border-t border-gray-800">
            <button id="prev-page" onclick="changePage(-1)" class="p-2 rounded-md bg-gray-800 hover:bg-gray-700 text-gray-400 disabled:opacity-50 disabled:cursor-not-allowed transition-colors" disabled>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <span id="page-indicator" class="text-xs text-gray-500 font-medium"></span>
            <button id="next-page" onclick="changePage(1)" class="p-2 rounded-md bg-gray-800 hover:bg-gray-700 text-gray-400 disabled:opacity-50 disabled:cursor-not-allowed transition-colors" disabled>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
    </div>

    <a id="manual-link" href="#" class="text-primary-500 font-medium skeleton link-hover break-all px-4 py-2 rounded-lg bg-primary-800/10 border border-primary-800/20 w-full mt-2">
      loading destination...
    </a>

  </main>

  <p class="mt-8 text-center text-xs text-gray-600 max-w-sm mx-4 opacity-80 hover:opacity-100 transition-opacity">
    want to own your own redirector? check out the project on <a href="https://github.com/fonseware/fnswe.me/" target="_blank" rel="noopener noreferrer" class="text-primary-600 hover:text-primary-400 underline decoration-primary-800/50 underline-offset-4">github project</a>. this project is open source and free to use, fork, or modify.
  </p>

  <script>
    // ==========================================
    // JS CONFIGURATION (Edit these for your fork)
    // ==========================================
    const CONFIG = {
      // Domains & URLs
      HOST_DOMAIN: "https://fnswe.me",
      FALLBACK_URL: "https://fonseware.com",
      REDIRECTS_FILE: "./redirects.json",
      LOGO_URL: "https://github.com/fonseware/.github/blob/main/fw_logo.png?raw=true",
      FAVICON_URL: "https://github.com/fonseware/.github/blob/main/fw_favicon.png?raw=true",
      
      // Timings
      TOTAL_DELAY_SECONDS: 6,
      
      // Display Strings (Keep lowercase for aesthetic)
      TXT_DESC: "please wait while we redirect you to the destination page.",
      TXT_REDIRECTING: "redirecting to",
      TXT_DEFAULT_DOMAIN: "fonseware.com",
      TXT_NOT_FOUND: "uh. oh. destination not found, redirecting to fonseware.com",
      TXT_ERROR: "there was a system error.",
      TXT_PAUSED: "redirect paused.",
      TXT_IN_A_HURRY: "in a hurry? click here to go to",
      TXT_ROUTES_TITLE: "available routes",
      TXT_LINKS: "links found",
      TXT_NO_LINKS: "no links available",
      TXT_CANCEL: "cancel redirect",
      TXT_VIEW_LINKS: "view all links",
      TXT_SECONDS: "seconds",
      TXT_PAGE: "page"
    };

    let countdownTimer = null;
    let allRedirects = [];
    let currentPage = 1;
    const itemsPerPage = 6;
    let isRedirectCancelled = false;

    // Helper to safely update text
    const setText = (id, text) => {
      const el = document.getElementById(id);
      if (el) el.textContent = text.toLowerCase();
    };

    function cancelRedirect() {
        if (countdownTimer) {
            clearInterval(countdownTimer);
            isRedirectCancelled = true;
            
            // Hide countdown and cancel button completely
            document.getElementById("countdown-container").classList.add("hidden");
            document.getElementById("countdown-container").classList.remove("flex");
            document.getElementById("cancel-btn").classList.add("hidden");
            document.getElementById("action-buttons").classList.remove("sm:flex-row");
            
            // Show view links button standalone
            document.getElementById("list-btn").classList.remove("hidden");
            
            setText("redirect-title", CONFIG.TXT_PAUSED);
        }
    }

    function renderLinksList() {
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const currentItems = allRedirects.slice(startIndex, endIndex);
        const listEl = document.getElementById("links-list");
        
        listEl.innerHTML = "";
        
        if (currentItems.length === 0) {
            listEl.innerHTML = `<li class="text-gray-500 text-sm py-2 text-center italic">${CONFIG.TXT_NO_LINKS}</li>`;
        } else {
            currentItems.forEach(item => {
                const li = document.createElement("li");
                li.className = "bg-[#111] border border-gray-800 rounded-md p-3 hover:border-primary-800/50 transition-colors group relative overflow-hidden";
                
                // Construct internal redirect path, enforcing a loop back into this processor
                const redirectPath = `${CONFIG.HOST_DOMAIN}/${item.id}`;
                
                li.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="truncate pr-4">
                            <div class="font-medium text-gray-200 text-sm mb-1 group-hover:text-primary-400 transition-colors">/${item.id}</div>
                            <div class="text-xs text-gray-500 truncate" title="${item.url}">${item.url.replace(/^https?:\/\//, '')}</div>
                        </div>
                        <a href="${redirectPath}" class="shrink-0 bg-gray-800 p-1.5 rounded-md text-gray-400 hover:text-white hover:bg-primary-800 transition-all z-10" aria-label="Go to ${item.id}">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>
                    </div>
                `;
                
                // Add click event to whole row (except if they click the specific arrow anchor)
                li.addEventListener('click', (e) => {
                   if(e.target.closest('a')) return;
                   window.location.href = redirectPath;
                });
                li.style.cursor = 'pointer';
                
                listEl.appendChild(li);
            });
        }

        updatePaginationControls();
    }

    function updatePaginationControls() {
        const totalPages = Math.ceil(allRedirects.length / itemsPerPage) || 1;
        document.getElementById("page-indicator").textContent = `${CONFIG.TXT_PAGE} ${currentPage} / ${totalPages}`;
        
        document.getElementById("prev-page").disabled = currentPage <= 1;
        document.getElementById("next-page").disabled = currentPage >= totalPages;
    }

    function changePage(delta) {
        const totalPages = Math.ceil(allRedirects.length / itemsPerPage);
        currentPage += delta;
        
        if (currentPage < 1) currentPage = 1;
        if (currentPage > totalPages) currentPage = totalPages;
        
        renderLinksList();
    }

    function goToRedirects() {
        window.location.href = `${CONFIG.HOST_DOMAIN}/redirects`;
    }

    function startCountdown(targetUrl) {
      let secondsLeft = CONFIG.TOTAL_DELAY_SECONDS;
      const countdownContainer = document.getElementById("countdown-container");
      const countdownText = document.getElementById("countdown-text");
      const countdownProgress = document.getElementById("countdown-progress");
      const descEl = document.getElementById("redirect-desc");
      const actionBtns = document.getElementById("action-buttons");
      
      // Reveal countdown UI and actions
      countdownContainer.classList.remove("hidden");
      countdownContainer.classList.add("flex");
      actionBtns.classList.remove("hidden");
      actionBtns.classList.add("flex");
      descEl.classList.add("hidden"); // Hide the static text to clean up UI

      countdownText.textContent = secondsLeft;

      // Calculate stroke dasharray for the SVG circle (2 * PI * 45 = ~283)
      const circumference = 283;

      countdownTimer = setInterval(() => {
        secondsLeft--;
        
        if (secondsLeft > 0) {
          countdownText.textContent = secondsLeft;
          // Update circle progress
          const offset = circumference - (secondsLeft / CONFIG.TOTAL_DELAY_SECONDS) * circumference;
          countdownProgress.style.strokeDashoffset = offset;
        } else {
          clearInterval(countdownTimer);
          if(!isRedirectCancelled) {
              countdownText.textContent = "0";
              countdownProgress.style.strokeDashoffset = circumference;
              // Execute redirect
              window.location.replace(targetUrl);
          }
        }
      }, 1000);
    }

    async function redirectUser() {
      const url = new URL(window.location.href);

      // Logic: Check for ?u= parameter first, otherwise check the path
      let key = url.searchParams.get("u") || url.pathname.slice(1);
      if (key && key.endsWith("/")) key = key.slice(0, -1);

      const manualLinkEl = document.getElementById("manual-link");

      // Handle specific /redirects route directly
      if (key === "redirects") {
        setText("redirect-title", CONFIG.TXT_ROUTES_TITLE);
        document.getElementById("redirect-desc").classList.add("hidden");
        manualLinkEl.classList.add("hidden");
        document.getElementById("action-buttons").classList.add("hidden");
        
        try {
            const res = await fetch(CONFIG.REDIRECTS_FILE, { cache: "no-store" });
            allRedirects = await res.json();
            document.getElementById("total-links").textContent = `${allRedirects.length} ${CONFIG.TXT_LINKS}`;
            document.getElementById("links-container").classList.remove("hidden");
            document.getElementById("links-container").classList.add("flex");
            renderLinksList();
        } catch(err) {
            console.error("redirect error:", err);
            setText("redirect-title", CONFIG.TXT_ERROR);
        }
        return;
      }

      // Dynamically update the HTML title with the requested key
      if (key) {
        setText("redirect-title", `${CONFIG.TXT_REDIRECTING} "${key}"`);
      } else {
        setText("redirect-title", `${CONFIG.TXT_REDIRECTING} ${CONFIG.TXT_DEFAULT_DOMAIN}`);
        manualLinkEl.textContent = `${CONFIG.TXT_IN_A_HURRY} ${CONFIG.FALLBACK_URL}`;
      }

      // If no key (just visiting fnswe.me), go to main website
      if (!key) {
        startCountdown(CONFIG.FALLBACK_URL);
        return;
      }

      try {
        const res = await fetch(CONFIG.REDIRECTS_FILE, { cache: "no-store" });
        const redirects = await res.json();
        
        allRedirects = redirects;

        const found = redirects.find(
          (item) => item.id.toLowerCase() === key.toLowerCase()
        );

        if (found && found.url) {
          // Update the manual link href and text to show where it points
          manualLinkEl.href = found.url;
          manualLinkEl.textContent = `${CONFIG.TXT_IN_A_HURRY} ${found.url}`;
          
          startCountdown(found.url);
        } else {
          // Not found condition
          manualLinkEl.textContent = `"${key}" not found, click here to go to ${CONFIG.FALLBACK_URL}`;
          setText("redirect-title", CONFIG.TXT_NOT_FOUND);
          
          startCountdown(CONFIG.FALLBACK_URL);
        }
      } catch (err) {
        console.error("redirect error:", err);
        manualLinkEl.textContent = `error, pointing to ${CONFIG.FALLBACK_URL}`;
        setText("redirect-title", CONFIG.TXT_ERROR);
        
        startCountdown(CONFIG.FALLBACK_URL);
      }
    }

    window.addEventListener("load", () => {
      // 1. Apply configurations to the DOM immediately
      document.getElementById("dynamic-favicon").href = CONFIG.FAVICON_URL;
      document.getElementById("logo-img").src = CONFIG.LOGO_URL;
      document.getElementById("logo-link").href = CONFIG.HOST_DOMAIN;
      
      document.getElementById("redirect-desc").textContent = CONFIG.TXT_DESC;
      document.getElementById("cancel-btn-text").textContent = CONFIG.TXT_CANCEL;
      document.getElementById("list-btn-text").textContent = CONFIG.TXT_VIEW_LINKS;
      document.getElementById("seconds-label").textContent = CONFIG.TXT_SECONDS;
      document.getElementById("routes-title").textContent = CONFIG.TXT_ROUTES_TITLE;

      // 2. Wait for fonts to load smoothly, then reveal content and run logic
      document.fonts.ready.then(() => {
        setTimeout(() => {
          document.querySelectorAll('.skeleton').forEach(el => {
            el.classList.remove('skeleton');
          });
          
          redirectUser();
        }, 300);
      });
    });
  </script>
</body>
</html>
